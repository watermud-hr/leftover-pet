name: Build LEFTOVER Apple Silicon v2

on:
  push:
    branches:
      - codex/macos-apple-silicon-v2
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Require Apple Silicon runner
        run: |
          test "$(uname -m)" = "arm64"
          sw_vers
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build dependencies
        run: python -m pip install --upgrade pip pyinstaller -r requirements-macos.txt
      - name: Create app icons
        run: |
          make_icon() {
            source="$1"
            output="$2"
            iconset="${output%.icns}.iconset"
            mkdir -p "$iconset"
            for size in 16 32 128 256 512; do
              sips -z "$size" "$size" "$source" --out "$iconset/icon_${size}x${size}.png"
              double=$((size * 2))
              sips -z "$double" "$double" "$source" --out "$iconset/icon_${size}x${size}@2x.png"
            done
            iconutil -c icns "$iconset" -o "$output"
          }
          make_icon assets/tray-icon-v2.png assets/LEFTOVER.icns
      - name: Build LEFTOVER
        run: pyinstaller --noconfirm --clean LEFTOVER-AppleSilicon.spec
      - name: Smoke-test complete LEFTOVER port
        run: |
          dist/LEFTOVER.app/Contents/MacOS/LEFTOVER --self-test | tee leftover-self-test.json
          grep -q '"finder_service": true' leftover-self-test.json
          grep -q '"swallow": true' leftover-self-test.json
          plutil -extract NSServices json -o - dist/LEFTOVER.app/Contents/Info.plist | tee leftover-services.json
          grep -q 'feedToLeftover' leftover-services.json
      - name: Sign and verify ARM64 apps
        run: |
          codesign --force --deep --sign - dist/LEFTOVER.app
          codesign --verify --deep --strict dist/LEFTOVER.app
          file dist/LEFTOVER.app/Contents/MacOS/LEFTOVER | tee leftover-arch.txt
          grep -q arm64 leftover-arch.txt
      - name: Create installable DMGs
        run: |
          mkdir -p package/LEFTOVER
          cp -R dist/LEFTOVER.app package/LEFTOVER/
          ln -s /Applications package/LEFTOVER/Applications
          printf '安装：把 LEFTOVER.app 拖到 Applications。首次启动若被拦截，请在“系统设置 → 隐私与安全性”点“仍要打开”。\n首次启动后，Finder 文件右键的“快速操作/服务”中会注册“喂给余食”。\n支持 Apple Silicon（M1/M2/M3/M4），macOS 13 或更高版本。\n' > package/LEFTOVER/安装说明.txt
          hdiutil create -volname '余食 LEFTOVER' -srcfolder package/LEFTOVER -ov -format UDZO LEFTOVER-Apple-Silicon-v0.4.0.dmg
          shasum -a 256 LEFTOVER-Apple-Silicon-v0.4.0.dmg > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: LEFTOVER-Apple-Silicon-v2
          path: |
            LEFTOVER-Apple-Silicon-v0.4.0.dmg
            SHA256SUMS.txt
          if-no-files-found: error
