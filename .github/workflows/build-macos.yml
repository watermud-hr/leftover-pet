name: Build macOS Beta

on:
  workflow_dispatch:
  push:
    branches:
      - codex/macos-beta

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: apple-silicon
          - runner: macos-15-intel
            arch: intel
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build dependencies
        run: python -m pip install --upgrade pip pyinstaller -r requirements.txt
      - name: Create macOS icon
        run: |
          mkdir -p assets/LEFTOVER.iconset
          for size in 16 32 128 256 512; do
            sips -z "$size" "$size" assets/tray-icon-v2.png --out "assets/LEFTOVER.iconset/icon_${size}x${size}.png"
            double=$((size * 2))
            sips -z "$double" "$double" assets/tray-icon-v2.png --out "assets/LEFTOVER.iconset/icon_${size}x${size}@2x.png"
          done
          iconutil -c icns assets/LEFTOVER.iconset -o assets/LEFTOVER.icns
      - name: Build app bundle
        run: pyinstaller --noconfirm --clean LEFTOVER-mac.spec
      - name: Ad-hoc sign app
        run: codesign --force --deep --sign - dist/LEFTOVER.app
      - name: Package app
        run: ditto -c -k --sequesterRsrc --keepParent dist/LEFTOVER.app "LEFTOVER-macOS-${{ matrix.arch }}-beta.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: LEFTOVER-macOS-${{ matrix.arch }}-beta
          path: LEFTOVER-macOS-${{ matrix.arch }}-beta.zip
